spring.application.name=legal-ai-backend

# ==========================
# Database
# ==========================
spring.datasource.url=jdbc:mysql://localhost:3306/legal_ai_db
spring.datasource.username=YOUR_DB_USERNAME
spring.datasource.password=YOUR_DB_PASSWORD

# ==========================
# JPA
# ==========================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ==========================
# Server
# ==========================
server.port=8081

# ==========================
# JWT
# ==========================
jwt.secret=YOUR_BASE64_SECRET
jwt.expiration=86400000

# Upload
file.upload-dir=uploads

spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# NLP Service
nlp.service.url=http://localhost:5000/api/analyze

# AI Service
ai.service.base-url=http://localhost:8081