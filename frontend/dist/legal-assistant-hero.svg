<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 560" role="img" aria-labelledby="title desc">
  <title id="title">A citizen reviewing a rental agreement with AI assistance</title>
  <desc id="desc">A citizen asks whether they could lose their deposit. An AI assistant highlights the cited clause in the agreement.</desc>
  <defs>
    <filter id="shadow" x="-30%" y="-60%" width="160%" height="240%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#020617" flood-opacity=".4"/>
    </filter>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#14B8A6" stop-opacity=".3"/>
      <stop offset=".6" stop-color="#2563EB" stop-opacity=".14"/>
      <stop offset="1" stop-color="#2563EB" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <style>
    text{font-family:Inter,"Noto Sans","Segoe UI",system-ui,-apple-system,sans-serif}
    @keyframes pulse{0%,100%{transform:scale(.94);opacity:.8}50%{transform:scale(1.06);opacity:1}}
    .glow{transform-box:fill-box;transform-origin:center;animation:pulse 5s ease-in-out infinite}
    @keyframes breathe{to{transform:translateY(-4px)}}
    .breathe{animation:breathe 3.2s ease-in-out infinite alternate}
    @keyframes arm{from{transform:rotate(-5deg)}to{transform:rotate(4deg)}}
    .arm{transform-origin:268px 372px;animation:arm 3s ease-in-out infinite alternate}
    @keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
    .eye{transform-box:fill-box;transform-origin:center;animation:blink 4.5s infinite}
    @keyframes float{to{transform:translateY(-8px)}}
    .float{animation:float 6s ease-in-out infinite alternate}
    @keyframes drift-one{to{transform:translate(14px,-18px)}}
    @keyframes drift-two{to{transform:translate(-16px,14px)}}
    .drift-one{animation:drift-one 7s ease-in-out infinite alternate}
    .drift-two{animation:drift-two 9s ease-in-out infinite alternate}
    @keyframes question{0%,6%{opacity:0;transform:scale(.7)}10%,90%{opacity:1;transform:scale(1)}95%,100%{opacity:0;transform:scale(.95)}}
    .question{transform-box:fill-box;transform-origin:50% 100%;animation:question 10s cubic-bezier(.2,.8,.2,1) infinite}
    @keyframes answer-card{0%,18%{opacity:0;transform:translateY(12px)}22%,90%{opacity:1;transform:translateY(0)}95%,100%{opacity:0;transform:translateY(-6px)}}
    .answer-card{animation:answer-card 10s cubic-bezier(.2,.8,.2,1) infinite}
    @keyframes dots{0%,20%{opacity:0}22%,33%{opacity:1}35%,100%{opacity:0}}
    .dots{opacity:0;animation:dots 10s linear infinite}
    @keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
    .bounce{animation:bounce .9s ease-in-out infinite}
    @keyframes answer{0%,36%{opacity:0;transform:translateY(6px)}40%,90%{opacity:1;transform:translateY(0)}95%,100%{opacity:0}}
    .answer{animation:answer 10s ease-out infinite}
    @keyframes highlight{0%,38%{opacity:.35}42%,90%{opacity:1}95%,100%{opacity:.35}}
    .highlight{animation:highlight 10s linear infinite}
    @keyframes outline{0%,38%{opacity:0}42%,90%{opacity:1}95%,100%{opacity:0}}
    .outline{opacity:1;animation:outline 10s linear infinite}
    @keyframes shield{0%,44%{opacity:0;transform:scale(.4)}49%{opacity:1;transform:scale(1.15)}52%,90%{opacity:1;transform:scale(1)}95%,100%{opacity:0;transform:scale(.8)}}
    .shield{transform-box:fill-box;transform-origin:center;animation:shield 10s ease-out infinite}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important}.dots{display:none}}
  </style>

  <circle class="glow" cx="320" cy="300" r="270" fill="url(#glow)"/>
  <circle class="drift-one" cx="60" cy="230" r="4" fill="#14B8A6" opacity=".6"/>
  <circle class="drift-two" cx="300" cy="60" r="5" fill="#2563EB" opacity=".6"/>
  <circle class="drift-one" cx="620" cy="250" r="3.5" fill="#14B8A6" opacity=".6"/>
  <circle class="drift-two" cx="40" cy="420" r="5" fill="#2563EB" opacity=".5"/>
  <circle class="drift-one" cx="300" cy="520" r="3" fill="#14B8A6" opacity=".6"/>

  <g class="float">
    <rect x="330" y="110" width="270" height="306" rx="18" fill="#fff" filter="url(#shadow)"/>
    <rect x="348" y="126" width="18" height="22" rx="4" fill="#DBEAFE"/>
    <rect x="352" y="132" width="10" height="2" rx="1" fill="#2563EB"/>
    <rect x="352" y="137" width="10" height="2" rx="1" fill="#2563EB"/>
    <text x="374" y="142" font-size="12" font-weight="700" fill="#0F172A">Rental_Agreement</text>
    <rect x="508" y="128" width="76" height="20" rx="10" fill="#FEE2E2"/>
    <text x="546" y="141.5" text-anchor="middle" font-size="9" font-weight="700" fill="#B91C1C">78 · HIGH RISK</text>
    <rect x="348" y="158" width="236" height="1" fill="#E2E8F0"/>
    <rect x="348" y="172" width="236" height="44" rx="8" fill="#2563EB" fill-opacity=".12"/>
    <rect x="348" y="172" width="3" height="44" rx="1.5" fill="#2563EB"/>
    <rect x="362" y="183" width="150" height="6" rx="3" fill="#CBD5E1"/>
    <rect x="362" y="197" width="110" height="6" rx="3" fill="#CBD5E1"/>
    <rect x="348" y="226" width="236" height="44" rx="8" fill="#EF4444" fill-opacity=".12"/>
    <rect x="348" y="226" width="3" height="44" rx="1.5" fill="#EF4444"/>
    <rect x="362" y="237" width="140" height="6" rx="3" fill="#CBD5E1"/>
    <rect x="362" y="251" width="120" height="6" rx="3" fill="#CBD5E1"/>
    <g class="highlight">
      <rect x="348" y="280" width="236" height="44" rx="8" fill="#F59E0B" fill-opacity=".22"/>
      <rect x="348" y="280" width="3" height="44" rx="1.5" fill="#F59E0B"/>
    </g>
    <rect x="362" y="291" width="140" height="6" rx="3" fill="#CBD5E1"/>
    <rect x="362" y="305" width="100" height="6" rx="3" fill="#CBD5E1"/>
    <rect class="outline" x="348" y="280" width="236" height="44" rx="8" fill="none" stroke="#F59E0B" stroke-width="2"/>
    <g class="outline">
      <rect x="508" y="291" width="64" height="20" rx="10" fill="#14B8A6"/>
      <text x="540" y="304.5" text-anchor="middle" font-size="9" font-weight="700" fill="#fff">Clause 3</text>
    </g>
    <rect x="348" y="334" width="236" height="44" rx="8" fill="#14B8A6" fill-opacity=".14"/>
    <rect x="348" y="334" width="3" height="44" rx="1.5" fill="#14B8A6"/>
    <rect x="362" y="345" width="130" height="6" rx="3" fill="#CBD5E1"/>
    <rect x="362" y="359" width="90" height="6" rx="3" fill="#CBD5E1"/>
    <rect x="348" y="388" width="150" height="6" rx="3" fill="#E2E8F0"/>
  </g>

  <g transform="translate(590,100)">
    <g class="shield">
      <circle r="26" fill="#0F172A" stroke="#14B8A6" stroke-width="2"/>
      <path d="M0-15 13-9V2c0 9-7 15-13 18C-6 17-13 11-13 2V-9Z" fill="#14B8A6"/>
      <path d="m-6 1 4.5 5L7-5" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>

  <g class="breathe">
    <path d="M96 560V412c0-50 34-70 94-72 60 2 94 22 94 72v148Z" fill="#2563EB"/>
    <rect x="174" y="306" width="32" height="48" rx="12" fill="#D69A6E"/>
    <path d="m164 340 26 38 26-38-14-4-12 16-12-16Z" fill="#fff" opacity=".92"/>
    <line x1="112" y1="374" x2="98" y2="452" stroke="#1D4ED8" stroke-width="30" stroke-linecap="round"/>
    <circle cx="96" cy="470" r="12" fill="#E8B48A"/>
    <g class="arm">
      <line x1="268" y1="374" x2="322" y2="352" stroke="#1D4ED8" stroke-width="30" stroke-linecap="round"/>
      <line x1="322" y1="352" x2="350" y2="314" stroke="#E8B48A" stroke-width="18" stroke-linecap="round"/>
      <circle cx="354" cy="306" r="11" fill="#E8B48A"/>
    </g>
    <circle cx="146" cy="272" r="8" fill="#E8B48A"/>
    <circle cx="234" cy="272" r="8" fill="#E8B48A"/>
    <ellipse cx="190" cy="268" rx="44" ry="50" fill="#E8B48A"/>
    <path d="M144 268c-6-54 24-70 48-70 32 0 54 20 46 70-6-26-24-36-48-36s-40 12-46 36Z" fill="#1E293B"/>
    <ellipse class="eye" cx="174" cy="272" rx="3.6" ry="4.6" fill="#0F172A"/>
    <ellipse class="eye" cx="206" cy="272" rx="3.6" ry="4.6" fill="#0F172A"/>
    <path d="M166 261q8-5 16-1m16 0q8-5 16 1" fill="none" stroke="#1E293B" stroke-width="2.4" stroke-linecap="round"/>
    <path d="m190 277q-3 8 3 9" fill="none" stroke="#C98B5E" stroke-width="2" stroke-linecap="round"/>
    <path d="M177 294q13 11 26 0" fill="none" stroke="#0F172A" stroke-width="2.6" stroke-linecap="round"/>
    <circle cx="162" cy="288" r="7" fill="#F472B6" opacity=".22"/>
    <circle cx="218" cy="288" r="7" fill="#F472B6" opacity=".22"/>
  </g>

  <g class="question">
    <rect x="70" y="118" width="226" height="46" rx="18" fill="#2563EB" filter="url(#shadow)"/>
    <path d="m152 163 12 21 16-21Z" fill="#2563EB"/>
    <text x="183" y="146" text-anchor="middle" font-size="13.5" font-weight="600" fill="#fff">Can I lose my deposit?</text>
  </g>

  <g transform="translate(330,440)">
    <g class="answer-card">
      <rect width="270" height="92" rx="16" fill="#fff" filter="url(#shadow)"/>
      <circle cx="30" cy="34" r="16" fill="#14B8A6"/>
      <text x="30" y="38" text-anchor="middle" font-size="11" font-weight="800" fill="#fff">AI</text>
      <g class="dots">
        <circle class="bounce" cx="66" cy="34" r="4" fill="#94A3B8"/>
        <circle class="bounce" style="animation-delay:-.15s" cx="80" cy="34" r="4" fill="#94A3B8"/>
        <circle class="bounce" style="animation-delay:-.3s" cx="94" cy="34" r="4" fill="#94A3B8"/>
      </g>
      <g class="answer">
        <text x="56" y="30" font-size="12" font-weight="700" fill="#0F172A">Yes — if rent is paid more than</text>
        <text x="56" y="47" font-size="12" font-weight="700" fill="#0F172A">5 days late.</text>
        <rect x="56" y="58" width="100" height="20" rx="10" fill="#CCFBF1"/>
        <text x="106" y="71.5" text-anchor="middle" font-size="10" font-weight="700" fill="#0F766E">Source: Clause 3</text>
      </g>
    </g>
  </g>
</svg>
